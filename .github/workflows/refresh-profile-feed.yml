name: Refresh Profile Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  checks: write
  deployments: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build refreshed hosting output
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_PROJECT_ID: ${{ vars.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_STORAGE_BUCKET: ${{ vars.FIREBASE_WEB_STORAGE_BUCKET }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
        run: npm run build:client && npm run build:profile-feed && npm run build:hosting

      - name: Check hosting output
        run: npm run check:hosting

      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEHNADZOR }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
